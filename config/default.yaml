# 默认运行时配置。相对路径由 core.config 以仓库根目录为基准解析。
project:
  name: "雄安新区城市大脑车路云一体化协同管控算法与仿真平台"
  version: "0.1.0"

paths:
  # 数据根目录。路口数据已随仓库提交，位于 data/intersection_data/。
  # 如需使用本地其他路径，可通过环境变量 CC_DATA_ROOT 覆盖。
  data_root: "./data/intersection_data"
  output_root: "./output"
  model_path: "./ml/model.pkl"

sumo:
  # 批量跑批推荐用命令行版 sumo；需要可视化观察时改为 sumo-gui。
  binary: "sumo"
  step_length: 0.1

simulation:
  duration_seconds: 3600
  warmup_seconds: 600
  quick_duration_seconds: 600

smoke:
  steps: 100

experiments:
  formal_seeds: [42, 43, 44]

scene:
  # 20 路口 × 2 流量等级 = 40 个变体
  default_traffic_levels:
    normal: 1.0
    high: 1.25
  # 正式扰动矩阵的冻结基线；每次运行仍须声明作用对象与时间窗。
  disturbance_defaults:
    # construction/failure intensity: (0, 1]，作用时间占声明时间窗的比例。
    # event_demand intensity: 正数，额外需求为每小时 360 * intensity 辆。
    construction:
      intensity: 1.0
      begin_seconds: 600
      end_seconds: 1200
    event_demand:
      intensity: 1.25
      begin_seconds: 600
      end_seconds: 1200
    vehicle_failure:
      intensity: 1.0
      begin_seconds: 600
      end_seconds: 1200

algorithms:
  fixed_time:
    # true：从 Excel 读取配时方案并写入 SUMO；
    # false：使用 SUMO 路网中自带的默认配时程序。
    use_excel_timing: false

  actuated:
    min_green: 10
    max_green: 60
    queue_threshold: 5

  ca_maxpressure:
    # 溢出门控阈值：进口道占用率超过此值时强制放行
    overflow_occupancy_threshold: 0.9
    # 云端下发参数默认值
    base_green: 30
    min_green: 10
    max_green: 90
    # 预测到达量在容量归一化压力中的权重
    prediction_weight: 0.15
    # 安全过渡相位的显式持续时间（秒）
    yellow_duration: 3
    all_red_duration: 1
    # EWMA 平滑系数
    ewma_alpha: 0.3
    # 云端流量预测时域（秒）
    prediction_horizon: 300
    # 云端参数下发间隔（步），600 步 = 60 仿真秒，与 cloud/cloud_policy.py dispatch_params 默认值对应
    cloud_update_interval: 600

metrics:
  # 每 600 步（= 60 仿真秒）记录一次快照，降低 CSV 体积。
  snapshot_interval: 600

logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
