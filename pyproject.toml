[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ca-mp"
version = "1.0.0"
description = "Capacity-Aware MaxPressure 信号控制平台"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = [
  "algorithms*",
  "api*",
  "cloud*",
  "core*",
  "engine*",
  "experiments*",
  "ml*",
  "scenes*",
  "visualization*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
