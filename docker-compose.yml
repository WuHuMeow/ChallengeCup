# 单容器编排。默认运行路口 1 的 100 步固定配时基线。
# 用法：docker compose up --build
#       docker compose run --rm simulation --intersection 16 --algorithm ca_maxpressure
services:
  simulation:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ca-mp:latest
    init: true
    volumes:
      - ./output:/app/output
    command:
      - "--intersection"
      - "1"
      - "--algorithm"
      - "fixed_time"
      - "--steps"
      - "100"
      - "--output-dir"
      - "/app/output/runs"
