<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1440 860"
     role="img"
     aria-labelledby="loop-title loop-desc">
  <title id="loop-title">单步仿真控制与证据生成流程</title>
  <desc id="loop-desc">一次 RunRequest 从变体生成、状态读取、CloudPolicy 与控制算法决策、TraCI 动作应用、仿真推进到指标和 summary.json 生成，并以配置终点或异常状态结束。</desc>

  <defs>
    <marker id="loop-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#1f4e79"/>
    </marker>
    <marker id="loop-teal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#0f766e"/>
    </marker>
    <marker id="loop-open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M1,1 L9,4 L1,7" fill="none" stroke="#475569" stroke-width="1.4"/>
    </marker>
    <marker id="loop-amber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#a8661d"/>
    </marker>
  </defs>

  <style>
    .title { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 24px; font-weight: 700; fill: #17324d; }
    .subtitle { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 12px; fill: #52677d; }
    .lane-title { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #49647b; }
    .node-title { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 12px; font-weight: 700; fill: #17324d; }
    .node-text { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 10px; fill: #41566b; }
    .code { font-family: "Cascadia Mono", Consolas, monospace; font-size: 9px; fill: #536b82; }
    .small { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 10px; fill: #60758a; }
    .tiny { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 9px; fill: #60758a; }
    .label { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 9px; font-weight: 700; fill: #41566b; }
    .lane-a { fill: #f7f9fb; stroke: #d2dce5; stroke-width: 1; }
    .lane-b { fill: #fbfcfd; stroke: #d2dce5; stroke-width: 1; }
    .lane-c { fill: #f5faf9; stroke: #c7ded8; stroke-width: 1; }
    .lane-d { fill: #fcf8f1; stroke: #e1cfb1; stroke-width: 1; }
    .node { fill: #ffffff; stroke: #a7b8c8; stroke-width: 1.2; }
    .node-blue { fill: #f3f7fb; stroke: #3d6f9e; stroke-width: 1.4; }
    .node-teal { fill: #f1faf8; stroke: #4f9a8c; stroke-width: 1.4; }
    .node-amber { fill: #fffaf2; stroke: #b5874a; stroke-width: 1.4; }
    .flow { fill: none; stroke: #1f4e79; stroke-width: 1.7; marker-end: url(#loop-blue); }
    .control { fill: none; stroke: #0f766e; stroke-width: 1.7; marker-end: url(#loop-teal); }
    .optional { fill: none; stroke: #0f766e; stroke-width: 1.4; stroke-dasharray: 7 5; marker-end: url(#loop-teal); }
    .return { fill: none; stroke: #475569; stroke-width: 1.4; marker-end: url(#loop-open); }
    .evidence { fill: none; stroke: #a8661d; stroke-width: 1.5; stroke-dasharray: 9 5 2 5; marker-end: url(#loop-amber); }
    .loopline { fill: none; stroke: #52677d; stroke-width: 1.5; stroke-dasharray: 8 5; marker-end: url(#loop-open); }
  </style>

  <rect width="1440" height="860" fill="#ffffff"/>
  <text x="720" y="36" text-anchor="middle" class="title">单步仿真控制与证据生成流程</text>
  <text x="720" y="59" text-anchor="middle" class="subtitle">F01–F11 · Observe → Decide → Act → simulationStep · 终态由 SUMO 配置、停止请求或异常决定</text>

  <rect x="30" y="82" width="900" height="748" rx="12" fill="#ffffff" stroke="#c3d0dc" stroke-width="1.4"/>
  <text x="52" y="106" class="lane-title">MAIN EXECUTION · 简化 BPMN-inspired / UML Activity view</text>

  <rect x="42" y="116" width="876" height="108" rx="8" class="lane-a"/>
  <text x="58" y="138" class="lane-title">CALLER / RUNSERVICE</text>
  <rect x="70" y="153" width="190" height="54" rx="7" class="node-blue"/>
  <text x="86" y="174" class="node-title">F01 · RunRequest</text>
  <text x="86" y="192" class="node-text">校验路口、算法、种子、步数</text>
  <rect x="310" y="153" width="210" height="54" rx="7" class="node-blue"/>
  <text x="326" y="174" class="node-title">F02 · RunArtifacts</text>
  <text x="326" y="192" class="node-text">创建独立 run_id 输出目录</text>

  <rect x="42" y="232" width="876" height="104" rx="8" class="lane-b"/>
  <text x="58" y="254" class="lane-title">SCENE / VARIANT</text>
  <rect x="70" y="268" width="190" height="54" rx="7" class="node"/>
  <text x="86" y="289" class="node-title">F03 · VariantBundle</text>
  <text x="86" y="307" class="node-text">原始场景只读，生成附加文件</text>
  <rect x="310" y="268" width="210" height="54" rx="7" class="node"/>
  <text x="326" y="289" class="node-title">F04 · JointState</text>
  <text x="326" y="307" class="node-text">TraCI get_state() 读取当前状态</text>

  <rect x="42" y="344" width="876" height="122" rx="8" class="lane-c"/>
  <text x="58" y="366" class="lane-title">SIMULATIONRUNNER · OBSERVE</text>
  <rect x="70" y="382" width="190" height="60" rx="7" class="node-teal"/>
  <text x="86" y="404" class="node-title">F05 · EdgeChannel（可选）</text>
  <text x="86" y="423" class="node-text">send / receive · 固定延迟</text>
  <text x="86" y="438" class="code">engine/edge_channel.py</text>
  <rect x="310" y="382" width="210" height="60" rx="7" class="node-teal"/>
  <text x="326" y="404" class="node-title">F06 · CloudPolicy</text>
  <text x="326" y="423" class="node-text">预测到达 · 周期性参数</text>
  <text x="326" y="438" class="code">cloud/cloud_policy.py</text>

  <rect x="42" y="474" width="876" height="112" rx="8" class="lane-c"/>
  <text x="58" y="496" class="lane-title">ALGORITHM / DECIDE</text>
  <rect x="70" y="512" width="190" height="56" rx="7" class="node-teal"/>
  <text x="86" y="533" class="node-title">F07 · algorithm.step()</text>
  <text x="86" y="551" class="node-text">JointState → ControlAction[]</text>
  <text x="86" y="565" class="code">fixed_time / actuated / CA-MP</text>
  <rect x="310" y="512" width="210" height="56" rx="7" class="node-teal"/>
  <text x="326" y="533" class="node-title">F08 · validate + apply</text>
  <text x="326" y="551" class="node-text">动作校验 → ActionResult[]</text>
  <text x="326" y="565" class="code">action_validation.py · TraCI</text>

  <rect x="42" y="594" width="876" height="112" rx="8" class="lane-d"/>
  <text x="58" y="616" class="lane-title">BRIDGE / SUMO · ACT</text>
  <rect x="70" y="632" width="190" height="56" rx="7" class="node-amber"/>
  <text x="86" y="653" class="node-title">F09 · simulationStep()</text>
  <text x="86" y="671" class="node-text">推进仿真时钟，检查耗尽</text>
  <text x="86" y="685" class="code">TraCIBridge / MockBridge</text>
  <rect x="310" y="632" width="210" height="56" rx="7" class="node-amber"/>
  <text x="326" y="653" class="node-title">F10 · collect + log</text>
  <text x="326" y="671" class="node-text">metrics / events / step log</text>
  <text x="326" y="685" class="code">engine/collector.py</text>

  <rect x="42" y="714" width="876" height="104" rx="8" class="lane-a"/>
  <text x="58" y="736" class="lane-title">ARTIFACTS / SUMMARY</text>
  <rect x="70" y="752" width="190" height="52" rx="7" class="node-amber"/>
  <text x="86" y="773" class="node-title">F11 · 精确汇总</text>
  <text x="86" y="792" class="node-text">tripinfo + metrics → summary</text>
  <polygon points="590,738 618,766 590,794 562,766" fill="#ffffff" stroke="#a8661d" stroke-width="1.4"/>
  <text x="590" y="764" text-anchor="middle" class="tiny">终态?</text>
  <text x="590" y="810" text-anchor="middle" class="tiny">configured_end / stop / error</text>

  <path d="M260,180 H310" class="flow"/>
  <text x="285" y="171" text-anchor="middle" class="label">RunRequest</text>
  <path d="M415,207 V240 H165 V268" class="flow"/>
  <path d="M260,295 H310" class="flow"/>
  <path d="M415,322 V355 H165 V382" class="flow"/>
  <path d="M260,412 H310" class="optional"/>
  <text x="285" y="403" text-anchor="middle" class="label">state</text>
  <path d="M415,442 V485 H165 V512" class="control"/>
  <path d="M260,540 H310" class="control"/>
  <text x="285" y="531" text-anchor="middle" class="label">ControlAction[]</text>
  <path d="M415,568 V612 H165 V632" class="control"/>
  <path d="M260,660 H310" class="control"/>
  <text x="285" y="651" text-anchor="middle" class="label">ActionResult[]</text>
  <path d="M415,688 V732 H165 V752" class="evidence"/>
  <path d="M520,660 H562" class="evidence"/>
  <text x="540" y="650" text-anchor="middle" class="label">status</text>
  <path d="M618,766 H680" class="evidence"/>
  <text x="650" y="756" text-anchor="middle" class="label">completed</text>
  <path d="M590,794 V825 H42 V322 H310" class="loopline"/>
  <text x="74" y="817" class="tiny">not terminal → next simulation step → F04</text>

  <g id="ca-mp-decision">
    <rect x="950" y="82" width="440" height="438" rx="12" fill="#f8fbfb" stroke="#7baaa2" stroke-width="1.4"/>
    <text x="974" y="110" class="lane-title">CA-MP DECISION DETAIL · A01–A07</text>
    <text x="974" y="132" class="small">合法相位优先；CloudPolicy 是进程内策略来源</text>

    <rect x="974" y="153" width="392" height="42" rx="6" class="node-teal"/>
    <text x="990" y="170" class="node-title">A01 · 读取 PhaseTrafficState</text>
    <text x="990" y="187" class="node-text">真实 phase_index / signal_state / 上下游车道</text>

    <rect x="974" y="205" width="392" height="42" rx="6" class="node"/>
    <text x="990" y="222" class="node-title">A02 · 容量归一化压力</text>
    <text x="990" y="239" class="node-text">incoming queue / capacity − outgoing queue / capacity</text>

    <rect x="974" y="257" width="392" height="42" rx="6" class="node"/>
    <text x="990" y="274" class="node-title">A03 · 预测修正</text>
    <text x="990" y="291" class="node-text">CloudPolicy.predict() × prediction_weight</text>

    <rect x="974" y="309" width="392" height="42" rx="6" class="node-amber"/>
    <text x="990" y="326" class="node-title">A04 · 下游溢出门控</text>
    <text x="990" y="343" class="node-text">occupancy ≥ threshold → phase 不可选</text>

    <rect x="974" y="361" width="392" height="42" rx="6" class="node-teal"/>
    <text x="990" y="378" class="node-title">A05 · 选择合法绿灯相位</text>
    <text x="990" y="395" class="node-text">argmax pressure；只使用真实整数 phase_index</text>

    <rect x="974" y="413" width="392" height="42" rx="6" class="node"/>
    <text x="990" y="430" class="node-title">A06 · 绿灯与安全过渡约束</text>
    <text x="990" y="447" class="node-text">min/max green · yellow · all-red</text>

    <rect x="974" y="465" width="392" height="42" rx="6" class="node-teal"/>
    <text x="990" y="482" class="node-title">A07 · 动态时长与动作</text>
    <text x="990" y="499" class="node-text">set_phase(int) + set_phase_duration(float)</text>

    <path d="M1170,195 V205" class="control"/>
    <path d="M1170,247 V257" class="control"/>
    <path d="M1170,299 V309" class="control"/>
    <path d="M1170,351 V361" class="control"/>
    <path d="M1170,403 V413" class="control"/>
    <path d="M1170,455 V465" class="control"/>
    <path d="M520,412 H900 V174 H974" class="optional"/>
    <text x="886" y="164" text-anchor="end" class="label">CA-MP uses CloudPolicy</text>
  </g>

  <g id="terminal-status">
    <rect x="950" y="545" width="440" height="285" rx="12" fill="#fffdfa" stroke="#c09b68" stroke-width="1.4"/>
    <text x="974" y="573" class="lane-title">TERMINAL STATES / EVIDENCE</text>
    <rect x="974" y="592" width="184" height="42" rx="6" class="node-amber"/>
    <text x="990" y="609" class="node-title">completed</text>
    <text x="990" y="626" class="node-text">配置终点或目标步数</text>
    <rect x="1174" y="592" width="192" height="42" rx="6" class="node"/>
    <text x="1190" y="609" class="node-title">ended_early</text>
    <text x="1190" y="626" class="node-text">SUMO 提前耗尽</text>
    <rect x="974" y="647" width="184" height="42" rx="6" class="node"/>
    <text x="990" y="664" class="node-title">stopped</text>
    <text x="990" y="681" class="node-text">stop request</text>
    <rect x="1174" y="647" width="192" height="42" rx="6" class="node"/>
    <text x="1190" y="664" class="node-title">disconnected</text>
    <text x="1190" y="681" class="node-text">fatal TraCI error</text>
    <rect x="974" y="702" width="184" height="42" rx="6" class="node"/>
    <text x="990" y="719" class="node-title">interrupted</text>
    <text x="990" y="736" class="node-text">KeyboardInterrupt</text>
    <rect x="1174" y="702" width="192" height="42" rx="6" class="node"/>
    <text x="1190" y="719" class="node-title">failed</text>
    <text x="1190" y="736" class="node-text">异常 + metadata</text>
    <text x="974" y="778" class="small">F11 writes summary.json; all terminal reasons stay auditable.</text>
    <text x="974" y="798" class="code">experiments/summary.py · engine/artifacts.py</text>
    <text x="1380" y="846" text-anchor="end" class="tiny">solid = runtime · dashed = optional/loop · dash-dot = evidence · Source: engine/runner.py</text>
  </g>
</svg>
